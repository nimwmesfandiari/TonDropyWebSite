<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مبدل | تن‌دراپی</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="converter">
  <main class="container" style="max-width:520px">
    <section class="card">
      <h2>مبدل ارز</h2>
      <p class="muted small">محاسبه تقریبی بر پایه قیمت میانی؛ مبلغ نهایی همیشه در مرحله قیمت‌گیری سفارش نمایش داده می‌شود.</p>
      <div class="field"><label for="amt">مقدار</label><input id="amt" class="input ltr" inputmode="decimal" value="1"></div>
      <div class="row">
        <select id="from" class="select" style="flex:1"></select>
        <span>←</span>
        <select id="to" class="select" style="flex:1"></select>
      </div>
      <div class="quote-box" style="margin-top:16px"><div class="price-big num" id="result">—</div></div>
    </section>
  </main>
  <script type="module">
    import { boot, $, h, fmt } from "/assets/js/app.js";
    import { fetchPrices } from "/assets/js/market.js";
    import { ASSET_LABEL } from "/assets/js/config.js";

    boot(async () => {
      const { prices } = await fetchPrices();
      // Build a rate graph from the available mid prices (display only).
      const rate = { TON: { TON: 1 }, USDT: { USDT: 1 }, IRT: { IRT: 1 } };
      for (const p of prices.filter((x) => x.available)) {
        const [b, q] = p.pair.split("/");
        rate[b][q] = Number(p.mid);
        rate[q][b] = 1 / Number(p.mid);
      }
      const assets = Object.keys(rate);
      for (const id of ["from", "to"]) {
        $("#" + id).append(...assets.map((a) => h("option", { value: a }, ASSET_LABEL[a])));
      }
      $("#to").value = "IRT";
      function calc() {
        const a = Number($("#amt").value.replace(",", "."));
        const r = rate[$("#from").value][$("#to").value];
        if (!Number.isFinite(a) || a < 0 || !r) { $("#result").textContent = "—"; return; }
        const v = a * r;
        const digits = $("#to").value === "IRT" ? 0 : 6;
        $("#result").textContent = `${fmt(v.toFixed(digits), $("#to").value)} ${ASSET_LABEL[$("#to").value]}`;
      }
      ["input", "change"].forEach((ev) => document.addEventListener(ev, calc));
      calc();
    }, { public: true });
  </script>
</body>
</html>
