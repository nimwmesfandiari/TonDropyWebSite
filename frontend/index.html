<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>تن‌دراپی | خرید و فروش TON و USDT</title>
  <meta name="description" content="خرید و فروش سریع TON و USDT با تومان">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body data-page="home">
  <main class="container">
    <section class="hero">
      <h1>خرید و فروش TON و USDT با تومان</h1>
      <p>قیمت لحظه‌ای، قفل قیمت ۳۰ ثانیه‌ای و برداشت با بررسی دستی. ورود فقط با تلگرام.</p>
      <div id="login-box" class="card" style="max-width:420px;margin:24px auto 0">
        <div id="widget" class="row" style="justify-content:center"></div>
        <div id="msg" class="alert danger hidden" style="margin-top:12px"></div>
        <div id="dev" class="hidden" style="margin-top:16px">
          <hr style="border:0;border-top:1px solid var(--border)">
          <p class="muted small">ورود آزمایشی (فقط محیط توسعه)</p>
          <div class="row">
            <input id="dev-id" class="input ltr" value="1001" inputmode="numeric" style="flex:1">
            <button id="dev-btn" class="btn" type="button">ورود</button>
          </div>
        </div>
      </div>
    </section>
    <section class="card" style="margin-top:24px">
      <h2>قیمت‌های لحظه‌ای</h2>
      <div id="prices"></div>
    </section>
  </main>
  <script type="module">
    import { mountPriceTable } from "/assets/js/market.js";
    import { api, getToken } from "/assets/js/api.js";
    import { loginWithTelegramWebApp, mountTelegramWidget, devLogin } from "/assets/js/auth.js";
    import { $, showError } from "/assets/js/app.js";

    mountPriceTable($("#prices"));
    if (getToken()) location.replace("/pages/dashboard.html");

    (async () => {
      try {
        if (await loginWithTelegramWebApp()) return;
        const cfg = await api("/market/config", { auth: false });
        if (cfg.botUsername) mountTelegramWidget($("#widget"), cfg.botUsername);
        else $("#widget").textContent = "ورود تلگرام هنوز تنظیم نشده است.";
        $("#widget").addEventListener("login-error", (e) => showError(e.detail));
        if (["localhost", "127.0.0.1"].includes(location.hostname)) {
          $("#dev").classList.remove("hidden");
          $("#dev-btn").addEventListener("click", () => devLogin($("#dev-id").value, "dev").catch(showError));
        }
      } catch (e) { showError(e); }
    })();
  </script>
</body>
</html>
